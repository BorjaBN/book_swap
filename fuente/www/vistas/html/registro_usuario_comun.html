<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/book_swap/fuente/www/">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Playfair+Display&display=swap" rel="stylesheet"> <!--Tipografia-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Registro en Bookswap</title>
</head>
<body>
    <main class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="form-card text-center p-4">
            <h2 class="mb-4" style="font-family: 'Playfair Display', serif;">Formulario de Registro de Usuario</h2>
            <div class="form-message mb-3">Rellena todos los campos.</div>

            <form action="index.php?controlador=ControladorUsuarioComun&metodo=registrar" method="post" class="text-start">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="pass" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" class="form-control" required>
                </div>

                <button type="submit" class="btn-form-primary w-100">Registrarse</button>
            </form>
        </div>
  </main>

</body>
</html>
